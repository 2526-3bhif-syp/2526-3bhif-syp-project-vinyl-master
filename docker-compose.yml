services:
  postgres:
    image: postgres:latest
    container_name: vinylmaster-db
    environment:
      POSTGRES_DB: vinylmaster
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d vinylmaster"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
