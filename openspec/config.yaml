schema: spec-driven

context: |
  Tech stack: Java 21, JavaFX 23, Jackson (JSON serialization), Gradle 8.11+
  Architecture: Multi-module Gradle project following MVC pattern (modules: model, view, controller)
  Data persistence: Local file-based JSON storage in project root (data/vinyls.json, data/genres.json)
  Cover images: Scale/crop to 256x256 JPG and save to user-local directory (~/.vinylmaster/covers)
  Conventions:
    - Target Java version: 21 (run tests using a compatible JDK, e.g., IntelliJ's JBR)
    - Domain entity validation: backend validation in service layer; basic format/required field validation in frontend UI controllers.
    - Duplicate detection: same title + artist + year.
